# This is a basic workflow that is manually triggered

name: Upload Release

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    inputs:
      releaseId:
        type: string
        required: true
        description: Release ID

permissions: {}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [24.x]
        runtime:
          - linux-x64
          - linux-armv7l
          - linux-arm64
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
        include:
        - runtime: linux-x64
          os: ubuntu-latest

        - runtime: linux-armv7l
          os: ubuntu-latest

        - runtime: linux-arm64
          os: ubuntu-latest

        - runtime: osx-x64
          os: macOS-latest

        - runtime: osx-arm64
          os: macOS-latest

        - runtime: win-x64
          os: windows-latest

        - runtime: win-arm64
          os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      with:
        persist-credentials: false

    # Do not restore the yarn cache, to avoid cache poisoning affecting releases
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - run: yarn run ci
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    - run: yarn run lint
      shell: bash

    - name: Get Version Number
      id: getPackageInfo
      shell: bash
      run: |
        jq --raw-output '"version=" + .version' package.json >> "$GITHUB_OUTPUT"

    - name: Install libarchive-tools
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      run: |
        sudo apt update
        sudo apt -y install libarchive-tools

    - name: Build x64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'x64')
      shell: bash
      run: yarn run build

    - name: Build ARMv7l with Node.js ${{ matrix.node-version}}
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      shell: bash
      run: yarn run build:arm32

    - name: Build ARM64 with Node.js ${{ matrix.node-version}}
      if: contains(matrix.runtime, 'arm64')
      shell: bash
      run: yarn run build:arm64

    - name: Convert X64 AppImage to static runtime and add update information
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      shell: bash
      env:
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      run: |
        sudo apt install desktop-file-utils
        cd build
        appimage="FreeTube + Tabs-${VERSION}.AppImage"
        wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O ./appimagetool.AppImage
        chmod +x ./"$appimage" ./appimagetool.AppImage
        update_information='gh-releases-zsync|countgitmick|FreeTubePlusTabs|latest-all|freetube-plus-tabs-*-amd64.AppImage.zsync'
        ./"$appimage" --appimage-extract && rm -f ./"$appimage"
        ./appimagetool.AppImage --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 20 \
          -u "$update_information" -n ./squashfs-root ./"$appimage"
        rm -rf ./squashfs-root ./appimagetool.AppImage

    - name: Convert ARMv7l AppImage to static runtime and add update information
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      shell: bash
      env:
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      run: |
        sudo apt install desktop-file-utils
        cd build
        appimage="FreeTube + Tabs-${VERSION}.AppImage"
        wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O ./appimagetool.AppImage
        wget "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" -O runtime
        chmod +x ./"$appimage" ./appimagetool.AppImage ./runtime
        update_information='gh-releases-zsync|countgitmick|FreeTubePlusTabs|latest-all|freetube-plus-tabs-*-armv7l.AppImage.zsync'
        TARGET_APPIMAGE="$appimage" ./runtime --appimage-extract && rm -f ./"$appimage"
        ARCH=armhf ./appimagetool.AppImage --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 20 \
          -u "$update_information" -n ./squashfs-root ./"$appimage"
        rm -rf ./squashfs-root ./appimagetool.AppImage ./runtime

    - name: Convert ARM64 AppImage to static runtime and add update information
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      shell: bash
      env:
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      run: |
        sudo apt install desktop-file-utils
        cd build
        appimage="FreeTube + Tabs-${VERSION}.AppImage"
        wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O ./appimagetool.AppImage
        wget "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" -O runtime
        chmod +x ./"$appimage" ./appimagetool.AppImage ./runtime
        update_information='gh-releases-zsync|countgitmick|FreeTubePlusTabs|latest-all|freetube-plus-tabs-*-arm64.AppImage.zsync'
        TARGET_APPIMAGE="$appimage" ./runtime --appimage-extract && rm -f ./"$appimage"
        ARCH=aarch64 ./appimagetool.AppImage --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 20 \
          -u "$update_information" -n ./squashfs-root ./"$appimage"
        rm -rf ./squashfs-root ./appimagetool.AppImage ./runtime

    - name: Upload Linux x64 Release Assets
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-x64')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_ID: ${{ inputs.releaseId }}
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      shell: bash
      run: |
        upload_asset() {
          local file="$1" name="$2"
          gh api "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
            --method POST \
            -H "Content-Type: application/octet-stream" \
            --input "$file"
        }
        upload_asset "build/freetube-plus-tabs-${VERSION}.zip" \
          "freetube-plus-tabs-${VERSION}-beta-linux-x64-portable.zip"
        upload_asset "build/freetube-plus-tabs-${VERSION}.7z" \
          "freetube-plus-tabs-${VERSION}-beta-linux-x64-portable.7z"
        upload_asset "build/freetube-plus-tabs_${VERSION}_amd64.deb" \
          "freetube-plus-tabs_${VERSION}_beta_amd64.deb"
        upload_asset "build/FreeTube + Tabs-${VERSION}.AppImage" \
          "freetube-plus-tabs-${VERSION}-beta-amd64.AppImage"
        upload_asset "build/FreeTube + Tabs-${VERSION}.AppImage.zsync" \
          "freetube-plus-tabs-${VERSION}-beta-amd64.AppImage.zsync"
        upload_asset "build/freetube-plus-tabs-${VERSION}.x86_64.rpm" \
          "freetube-plus-tabs-${VERSION}-beta.amd64.rpm"
        upload_asset "build/freetube-plus-tabs-${VERSION}.pacman" \
          "freetube-plus-tabs-${VERSION}-beta-amd64.pacman"

    - name: Upload Linux ARMv7l Release Assets
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-armv7l')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_ID: ${{ inputs.releaseId }}
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      shell: bash
      run: |
        upload_asset() {
          local file="$1" name="$2"
          gh api "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
            --method POST \
            -H "Content-Type: application/octet-stream" \
            --input "$file"
        }
        upload_asset "build/freetube-plus-tabs-${VERSION}-armv7l.zip" \
          "freetube-plus-tabs-${VERSION}-beta-linux-armv7l-portable.zip"
        upload_asset "build/freetube-plus-tabs-${VERSION}-armv7l.7z" \
          "freetube-plus-tabs-${VERSION}-beta-linux-armv7l-portable.7z"
        upload_asset "build/freetube-plus-tabs_${VERSION}_armv7l.deb" \
          "freetube-plus-tabs_${VERSION}_beta_armv7l.deb"
        upload_asset "build/FreeTube + Tabs-${VERSION}-armv7l.AppImage" \
          "freetube-plus-tabs-${VERSION}-beta-armv7l.AppImage"
        upload_asset "build/FreeTube + Tabs-${VERSION}-armv7l.AppImage.zsync" \
          "freetube-plus-tabs-${VERSION}-beta-armv7l.AppImage.zsync"
        # rpm is not built for armv7l

    - name: Upload Linux ARM64 Release Assets
      if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.runtime, 'linux-arm64')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_ID: ${{ inputs.releaseId }}
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      shell: bash
      run: |
        upload_asset() {
          local file="$1" name="$2"
          gh api "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
            --method POST \
            -H "Content-Type: application/octet-stream" \
            --input "$file"
        }
        upload_asset "build/freetube-plus-tabs-${VERSION}-arm64.zip" \
          "freetube-plus-tabs-${VERSION}-beta-linux-arm64-portable.zip"
        upload_asset "build/freetube-plus-tabs-${VERSION}-arm64.7z" \
          "freetube-plus-tabs-${VERSION}-beta-linux-arm64-portable.7z"
        upload_asset "build/freetube-plus-tabs_${VERSION}_arm64.deb" \
          "freetube-plus-tabs_${VERSION}_beta_arm64.deb"
        upload_asset "build/FreeTube + Tabs-${VERSION}-arm64.AppImage" \
          "freetube-plus-tabs-${VERSION}-beta-arm64.AppImage"
        upload_asset "build/FreeTube + Tabs-${VERSION}-arm64.AppImage.zsync" \
          "freetube-plus-tabs-${VERSION}-beta-arm64.AppImage.zsync"
        upload_asset "build/freetube-plus-tabs-${VERSION}.aarch64.rpm" \
          "freetube-plus-tabs-${VERSION}-beta.arm64.rpm"

    - name: Upload Windows x64 Release Assets
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-x64')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_ID: ${{ inputs.releaseId }}
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      shell: bash
      run: |
        upload_asset() {
          local file="$1" name="$2"
          gh api "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
            --method POST \
            -H "Content-Type: application/octet-stream" \
            --input "$file"
        }
        upload_asset "build/FreeTube + Tabs Setup ${VERSION}.exe" \
          "freetube-plus-tabs-${VERSION}-beta-setup-x64.exe"
        upload_asset "build/FreeTube + Tabs ${VERSION}.exe" \
          "freetube-plus-tabs-${VERSION}-beta-win-x64-portable.exe"
        upload_asset "build/FreeTube + Tabs-${VERSION}-win.zip" \
          "freetube-plus-tabs-${VERSION}-beta-win-x64-portable.zip"
        upload_asset "build/FreeTube + Tabs-${VERSION}-win.7z" \
          "freetube-plus-tabs-${VERSION}-beta-win-x64-portable.7z"

    - name: Upload Windows arm64 Release Assets
      if: startsWith(matrix.os, 'windows') && startsWith(matrix.runtime, 'win-arm64')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_ID: ${{ inputs.releaseId }}
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      shell: bash
      run: |
        upload_asset() {
          local file="$1" name="$2"
          gh api "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
            --method POST \
            -H "Content-Type: application/octet-stream" \
            --input "$file"
        }
        upload_asset "build/FreeTube + Tabs Setup ${VERSION}.exe" \
          "freetube-plus-tabs-${VERSION}-beta-setup-arm64.exe"
        upload_asset "build/FreeTube + Tabs ${VERSION}.exe" \
          "freetube-plus-tabs-${VERSION}-beta-win-arm64-portable.exe"
        upload_asset "build/FreeTube + Tabs-${VERSION}-arm64-win.zip" \
          "freetube-plus-tabs-${VERSION}-beta-win-arm64-portable.zip"
        upload_asset "build/FreeTube + Tabs-${VERSION}-arm64-win.7z" \
          "freetube-plus-tabs-${VERSION}-beta-win-arm64-portable.7z"

    - name: Upload Mac x64 Release Assets
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-x64')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_ID: ${{ inputs.releaseId }}
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      shell: bash
      run: |
        upload_asset() {
          local file="$1" name="$2"
          gh api "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
            --method POST \
            -H "Content-Type: application/octet-stream" \
            --input "$file"
        }
        upload_asset "build/FreeTube + Tabs-${VERSION}.dmg" \
          "freetube-plus-tabs-${VERSION}-beta-mac-x64.dmg"
        upload_asset "build/FreeTube + Tabs-${VERSION}-mac.zip" \
          "freetube-plus-tabs-${VERSION}-beta-mac-x64.zip"
        upload_asset "build/FreeTube + Tabs-${VERSION}-mac.7z" \
          "freetube-plus-tabs-${VERSION}-beta-mac-x64.7z"

    - name: Upload Mac arm64 Release Assets
      if: startsWith(matrix.os, 'macos') && startsWith(matrix.runtime, 'osx-arm64')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_ID: ${{ inputs.releaseId }}
        VERSION: ${{ steps.getPackageInfo.outputs.version }}
      shell: bash
      run: |
        upload_asset() {
          local file="$1" name="$2"
          gh api "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
            --method POST \
            -H "Content-Type: application/octet-stream" \
            --input "$file"
        }
        upload_asset "build/FreeTube + Tabs-${VERSION}-arm64.dmg" \
          "freetube-plus-tabs-${VERSION}-beta-mac-arm64.dmg"
        upload_asset "build/FreeTube + Tabs-${VERSION}-arm64-mac.zip" \
          "freetube-plus-tabs-${VERSION}-beta-mac-arm64.zip"
        upload_asset "build/FreeTube + Tabs-${VERSION}-arm64-mac.7z" \
          "freetube-plus-tabs-${VERSION}-beta-mac-arm64.7z"
