name: Auto-merge GitHub Actions dependabot PRs

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions: {}

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check only GHA files changed
        id: gha-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fail safe: only auto-merge if every changed file is under .github/
          FILES=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json files --jq '.files[].path')
          NON_GHA=$(echo "$FILES" | grep -v '^\.github/' || true)
          if [ -z "$NON_GHA" ]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "Non-GHA files found; skipping auto-merge: $NON_GHA"
          fi

      - name: Approve and enable auto-merge
        if: steps.gha-only.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --approve \
            --body "Auto-approved: only GitHub Actions workflow files changed."
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto --squash
