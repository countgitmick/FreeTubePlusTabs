name: Update npmDepsHash

on:
  pull_request:
    paths:
      - 'package-lock.json'
      - 'yarn.lock'

permissions: {}

jobs:
  update-hash:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Compute correct npmDepsHash
        id: hash
        run: |
          new_hash=$(nix shell nixpkgs#prefetch-npm-deps -c prefetch-npm-deps package-lock.json 2>/dev/null)
          echo "new_hash=$new_hash" >> "$GITHUB_OUTPUT"

          current_hash=$(grep -oP 'npmDepsHash = "\K[^"]+' flake.nix)
          echo "current_hash=$current_hash" >> "$GITHUB_OUTPUT"

          if [ "$new_hash" != "$current_hash" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update flake.nix
        if: steps.hash.outputs.changed == 'true'
        run: |
          sed -i "s|npmDepsHash = \"${{ steps.hash.outputs.current_hash }}\"|npmDepsHash = \"${{ steps.hash.outputs.new_hash }}\"|" flake.nix

      - name: Commit updated hash
        if: steps.hash.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore: update npmDepsHash for dependency changes"
          git push
