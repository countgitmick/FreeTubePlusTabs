name: Auto-heal Dependabot npm PRs

# Dependabot cannot recompute this flake's fetchYarnDeps hash, so every npm PR
# fails Nix Build and never merges. This workflow heals the hash on the PR
# branch, proves the build is green, and leaves it ready for manual review and smoke-testing.
# Automatic merging is intentionally disabled to prevent breaking changes from landing untested.
#
# AUTOHEAL_TOKEN (optional, but strongly recommended)
#
# A push or a merge made with the default GITHUB_TOKEN never starts another
# workflow run. GitHub does this to stop recursive runs, and the exception list
# holds only workflow_dispatch and repository_dispatch. The healed head commit
# therefore carries zero checks, and the branch reads as untested even though
# the heal step below ran a full nix build on it.
#
# Set AUTOHEAL_TOKEN to a GitHub App installation token or a PAT with `repo`
# scope to restore the checks. Store it as a **Dependabot** secret, under
# Settings > Secrets and variables > Dependabot. A run triggered by Dependabot
# reads Dependabot secrets, and it cannot read Actions secrets. Add the same
# value as an Actions secret if the workflow_dispatch path needs it too.
#
# Without the secret the workflow still heals and still merges. Only the check
# runs on the healed commit are missing.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to heal (manual run; does not auto-merge)"
        required: true

permissions: {}

jobs:
  autoheal:
    # npm/yarn Dependabot PRs only, or a manual dispatch for testing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'dependabot[bot]' &&
       startsWith(github.head_ref, 'dependabot/npm_and_yarn/'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve PR number and head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ github.event.inputs.pr }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NUM="$INPUT_PR"
          else
            NUM="$EVENT_PR"
          fi
          HEAD=$(gh pr view "$NUM" --repo "$REPO" --json headRefName --jq '.headRefName')
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Get Dependabot metadata
        id: meta
        if: github.event_name == 'pull_request'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          # See AUTOHEAL_TOKEN in the header. An unset secret is an empty
          # string, so this falls back to the default token.
          token: ${{ secrets.AUTOHEAL_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Recompute fetchYarnDeps hash and verify build
        id: heal
        run: |
          FAKE="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          sed -i "s|hash = \"sha256-[^\"]*\"|hash = \"$FAKE\"|" flake.nix
          REAL=$(nix build .#default --no-link 2>&1 | grep -oE 'got: *sha256-[A-Za-z0-9+/=]+' | awk '{print $NF}' || true)
          if [ -z "$REAL" ]; then
            # No mismatch surfaced: restore and test the unmodified build.
            git checkout flake.nix
          else
            sed -i "s|hash = \"$FAKE\"|hash = \"$REAL\"|" flake.nix
          fi
          if git diff --quiet flake.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Ground truth: does the (healed) tree build end to end?
          if nix build .#default --no-link --print-build-logs; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit healed hash to the PR branch
        if: steps.heal.outputs.changed == 'true' && steps.heal.outputs.ok == 'true'
        env:
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          # [dependabot skip] is mandatory, not decoration. Dependabot stops
          # rebasing a PR as soon as a third party pushes a commit to it, and
          # this heal commit is exactly that push. Without the marker, the
          # first sibling PR to merge strands every other one in a conflict
          # that nothing ever clears. With it, Dependabot force-pushes a
          # rebase, and that push re-triggers this workflow to heal again.
          git commit -m "build(flake): recompute fetchYarnDeps hash [dependabot skip]"
          git push origin "HEAD:$HEAD"

      - name: Flag and fail when the build cannot be made green
        if: steps.heal.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$NUM" --repo "$REPO" \
            --body "Auto-heal recomputed the fetchYarnDeps hash but \`nix build .#default\` still fails. This update needs manual investigation before it can merge."
          exit 1

      - name: Comment that PR is healed and ready for review
        if: >-
          github.event_name == 'pull_request' &&
          steps.heal.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOHEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.pr.outputs.number }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          gh pr comment "$NUM" --repo "$REPO" \
            --body "fetchYarnDeps hash healed and \`nix build .#default\` passes ($UPDATE_TYPE). Ready for manual smoke-test and merge."
