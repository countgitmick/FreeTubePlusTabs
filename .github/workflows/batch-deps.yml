name: Batch Dependency Update

# Verifies and pushes straight to development rather than opening a PR.
#
# It used to open one, and those PRs could never merge: a PR created with the
# default GITHUB_TOKEN does not trigger `pull_request` workflows (GitHub's
# loop prevention), so they were born with no CI, could never go green, and
# piled up until they conflicted with each other. The PR body even said "CI
# must pass before merging" — CI could not run at all.
#
# Pushing directly also keeps working with the fork-PR approval gate set to
# all_external_contributors: this is a first-party workflow, so it is never
# held for approval the way Dependabot's PRs are.
#
# The trade is that nothing downstream reviews this, so the Verify step below
# has to be the gate: lint plus a full nix build before anything is pushed.

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  batch-deps:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Upgrade all compatible deps
        run: yarn upgrade 2>&1

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet yarn.lock package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.changes.outputs.changed == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Recompute fetchYarnDeps hash
        if: steps.changes.outputs.changed == 'true'
        id: nixhash
        run: |
          # flake.nix pins the yarn offline cache via:
          #   offlineCache = pkgs.fetchYarnDeps { yarnLock = ./yarn.lock; hash = "sha256-..."; };
          # Replace that hash with a fake one, build, and capture the real hash
          # from the fixed-output-derivation mismatch.
          FAKE="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          sed -i "s|hash = \"sha256-[^\"]*\"|hash = \"$FAKE\"|" flake.nix
          REAL_HASH=$(nix build .#default --no-link 2>&1 | grep -oE 'got: *sha256-[A-Za-z0-9+/=]+' | awk '{print $NF}' || true)
          if [ -n "$REAL_HASH" ]; then
            sed -i "s|hash = \"$FAKE\"|hash = \"$REAL_HASH\"|" flake.nix
            echo "hash_updated=true" >> "$GITHUB_OUTPUT"
          else
            # Hash unchanged — restore original
            git checkout flake.nix
            echo "hash_updated=false" >> "$GITHUB_OUTPUT"
          fi

      # This pushes straight to development instead of opening a PR, so nothing
      # downstream will check it — this step is the only gate that exists.
      # Anything that would have failed PR CI has to fail here instead.
      #
      # `yarn install` re-runs the postinstall patch script, which exits
      # non-zero if a patch youtubei.js still needs stops applying.
      - name: Verify the upgrade
        if: steps.changes.outputs.changed == 'true'
        run: |
          yarn install --frozen-lockfile
          yarn run lint
          nix build .#default --no-link

      - name: Push to development
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock flake.nix
          git commit -m "chore(deps): weekly batch dependency upgrade $(date +%Y-%m-%d)"
          # development may have moved while the build ran.
          git pull --rebase origin development
          git push origin HEAD:development
